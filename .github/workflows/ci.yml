name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" gitleaks
      - name: Scan complete candidate history
        run: |
          "${RUNNER_TEMP}/gitleaks" git . --no-banner --redact

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Keep PR feedback fast while retaining the full compatibility matrix
        # on main pushes.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[20, 22, 24]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Check connected artifact preflight and bundled notices
        run: node --test scripts/connected-mcp-notices.test.mjs scripts/prepare-connected-mcp.test.mjs

  sdk-candidate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          path: adapter
      - uses: actions/checkout@v7
        with:
          repository: SkyPorch/daykeeper-node
          # Reviewed release candidate, not a mutable branch or published upgrade.
          ref: 1eff7fbe9d63b3b4a89a0178ca1a7afe5b4ae914
          path: sdk-candidate
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build trusted candidate artifact
        working-directory: sdk-candidate
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          mkdir "${RUNNER_TEMP}/daykeeper-sdk-artifact"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/daykeeper-sdk-artifact"
      - name: Retain exact reviewed SDK artifact for cross-repo proof
        if: matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daykeeper-connected-sdk
          path: ${{ runner.temp }}/daykeeper-sdk-artifact/skyporch-daykeeper-0.2.0.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Check adapter against packed SDK
        working-directory: adapter
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check:sdk-candidate "${RUNNER_TEMP}/daykeeper-sdk-artifact/skyporch-daykeeper-0.2.0.tgz"
      - name: Build installed MCP package and verify bundled stdio runtime
        working-directory: adapter
        run: |
          node scripts/prepare-connected-mcp.mjs \
            "${RUNNER_TEMP}/daykeeper-sdk-artifact/skyporch-daykeeper-0.2.0.tgz" \
            "${RUNNER_TEMP}/daykeeper-connected-mcp"
